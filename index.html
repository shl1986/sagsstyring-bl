<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bjarne Larsen ApS · Platform</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --red:#B81C2B;--red-dark:#8e1520;--red-light:#fce8ea;
  --bg:#f4f1ec;--surface:#faf8f4;--text:#1a2024;--muted:#6b7a8d;--border:#ddd8ce;
  --white:#fff;--radius:4px;--radius-lg:8px;
  --sidebar:260px;
  --overdue:#791f1f;--overdue-bg:#f09595;
  --soon:#633806;--soon-bg:#FAC775;
}
body{font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:14px}

/* ── LOGIN ── */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg)}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:2.5rem;width:380px;max-width:90vw}
.login-card img{height:48px;margin-bottom:2rem;display:block}
.login-card h1{font-size:1.5rem;font-weight:700;margin-bottom:0.4rem}
.login-card p{font-size:0.88rem;color:var(--muted);margin-bottom:1.5rem}
.field{margin-bottom:1rem}
.field label{display:block;font-size:0.8rem;font-weight:600;margin-bottom:5px;color:var(--muted)}
.field input{width:100%;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius);font-family:Arial,Helvetica,sans-serif;font-size:0.95rem;background:var(--surface);color:var(--text)}
.field input:focus{outline:none;border-color:var(--red)}
.login-err{background:var(--red-light);color:var(--red-dark);font-size:0.83rem;padding:8px 12px;border-radius:var(--radius);margin-bottom:1rem;display:none}
.btn{font-family:Arial,Helvetica,sans-serif;font-size:0.85rem;font-weight:600;padding:9px 18px;border-radius:var(--radius);cursor:pointer;border:none;transition:all 0.15s;white-space:nowrap}
.btn-primary{background:var(--red);color:#fff;width:100%;padding:11px}
.btn-primary:hover{background:var(--red-dark)}
.btn-primary:disabled{opacity:0.6;cursor:not-allowed}

/* ── APP SHELL ── */
.app{display:none;min-height:100vh;flex-direction:column}
.app.visible{display:flex}

/* ── HEADER ── */
header{background:var(--red);padding:0 1rem;height:44px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;flex-shrink:0}
header img{height:26px;display:block}
.header-left{display:flex;align-items:center;gap:10px}
.header-right{display:flex;align-items:center;gap:8px}
.btn-burger{background:none;border:none;color:#fff;font-size:1.2rem;cursor:pointer;padding:4px 6px;line-height:1;opacity:0.85;transition:opacity 0.15s}
.btn-burger:hover{opacity:1}
.user-badge{background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.25);color:#fff;font-size:0.75rem;padding:3px 10px;border-radius:var(--radius)}
.btn-logout{background:none;border:1px solid rgba(255,255,255,0.25);color:#fff;font-size:0.75rem;padding:3px 10px;border-radius:var(--radius);cursor:pointer;font-family:Arial,Helvetica,sans-serif}
.btn-logout:hover{background:rgba(255,255,255,0.1)}

/* ── BODY LAYOUT ── */
.body-wrap{display:flex;flex:1;overflow:hidden}

/* ── SIDEBAR ── */
nav.sidebar{
  width:var(--sidebar);background:var(--surface);border-right:1px solid var(--border);
  overflow-y:auto;flex-shrink:0;padding:1.25rem 0;
  transition:width 0.2s ease, padding 0.2s ease;
}
nav.sidebar.collapsed{width:0;padding:0;overflow:hidden;border-right:none}
.nav-category{margin-bottom:0.25rem}
.nav-cat-btn{width:100%;background:none;border:none;padding:8px 1.25rem;display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-family:Arial,Helvetica,sans-serif;font-size:0.78rem;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:var(--muted);transition:color 0.15s}
.nav-cat-btn:hover{color:var(--text)}
.nav-cat-btn .arrow{font-size:10px;transition:transform 0.2s;display:inline-block}
.nav-cat-btn.open .arrow{transform:rotate(90deg)}
.nav-items{display:none;padding-bottom:0.5rem}
.nav-items.open{display:block}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 1.25rem 8px 1.75rem;cursor:pointer;font-size:0.88rem;color:var(--text);text-decoration:none;border-left:3px solid transparent;transition:all 0.15s}
.nav-item:hover{background:var(--red-light);color:var(--red)}
.nav-item.active{background:var(--red-light);color:var(--red);border-left-color:var(--red);font-weight:600}
.nav-item .icon{font-size:16px;width:20px;text-align:center;flex-shrink:0}
.nav-item .label{flex:1}
.nav-item .badge{background:var(--red);color:#fff;font-size:0.65rem;font-weight:700;padding:1px 6px;border-radius:10px}
.nav-empty{padding:6px 1.25rem 6px 1.75rem;font-size:0.82rem;color:var(--muted);font-style:italic}

/* ── MAIN CONTENT ── */
main.content{flex:1;overflow:auto;display:flex;align-items:stretch}
iframe#tool-frame{width:100%;border:none;flex:1;min-height:100%}

/* ── SPINNER ── */
.spinner{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(244,241,236,0.7);z-index:9999;align-items:center;justify-content:center}
.spinner.on{display:flex}
.spin{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--red);border-radius:50%;animation:spin 0.7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── FORSIDE DASHBOARD ── */
#forside{flex:1;overflow-y:auto;display:none}
#forside.visible{display:block}
.forside-page{max-width:1100px;margin:0 auto;padding:2rem 1.5rem}
.forside-title{font-size:1.4rem;font-weight:700;margin-bottom:0.3rem}
.forside-sub{color:var(--muted);font-size:0.88rem;margin-bottom:2rem}

/* Sagsoversigt */
.sag-stats{display:flex;gap:0.75rem;margin-bottom:2rem;flex-wrap:wrap}
.sag-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:0.9rem 1.25rem;flex:1;min-width:110px}
.sag-stat-num{font-size:1.8rem;font-weight:300;line-height:1;margin-bottom:0.15rem;display:flex;align-items:center;gap:6px}
.sag-stat-label{font-size:0.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0}
.dot-ny{background:#3b82f6}
.dot-igang{background:#f59e0b}
.dot-faerdig{background:#10b981}
.dot-alle{background:#6b7a8d}

/* Opgave stats */
.op-stats{display:flex;gap:1rem;margin-bottom:2rem;flex-wrap:wrap}
.op-stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.5rem;flex:1;min-width:140px}
.op-stat.red{border-left:3px solid var(--red)}
.op-stat.orange{border-left:3px solid #e07b00}
.op-stat.green{border-left:3px solid #2d6a4f}
.op-stat-num{font-size:2rem;font-weight:300;line-height:1;margin-bottom:0.2rem}
.op-stat-label{font-size:0.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:0.05em}

/* Divider */
.divider{border:none;border-top:1px solid var(--border);margin:0 0 2rem}

/* Sektionsheader */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.section-title{font-size:0.78rem;font-weight:700;text-transform:uppercase;letter-spacing:0.07em;color:var(--muted)}
.section-link{font-size:0.8rem;color:var(--red);text-decoration:none;cursor:pointer;background:none;border:none;font-family:Arial,Helvetica,sans-serif}
.section-link:hover{text-decoration:underline}
.section-hint{font-size:0.8rem;color:var(--muted);margin-bottom:1rem}

/* Kunde-kort (grupperingsvisning) */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem;margin-bottom:2.5rem}
.kunde-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:1rem 1.25rem;display:flex;flex-direction:column;gap:0.5rem;cursor:pointer;transition:box-shadow 0.15s}
.kunde-card:hover{box-shadow:0 2px 8px rgba(0,0,0,0.1)}
.kunde-card.overdue{border-left:3px solid #c0392b;background:#fffafa}
.kunde-card.soon{border-left:3px solid #e07b00;background:#fffcf5}
.card-sag{font-size:0.72rem;color:var(--muted);display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap}
.card-sagnr{font-weight:700;color:var(--text);flex-shrink:0}
.card-overskrift{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.card-adresse{font-size:0.75rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-tasks{display:flex;flex-direction:column;gap:0.35rem;margin-top:0.15rem}
.task-row{display:flex;align-items:center;gap:0.5rem;padding:0.3rem 0;border-top:1px solid var(--border)}
.task-row:first-child{border-top:none}
.task-text{font-size:0.88rem;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task-meta{display:flex;align-items:center;gap:5px;flex-shrink:0}
.deadline-pill{font-size:0.68rem;font-weight:700;padding:2px 7px;border-radius:20px;flex-shrink:0}
.overdue .deadline-pill{background:var(--overdue-bg);color:var(--overdue)}
.soon .deadline-pill{background:var(--soon-bg);color:var(--soon)}
.card-fag{font-size:0.65rem;padding:2px 6px;border-radius:20px;font-weight:600;flex-shrink:0}
.fag-mu{background:#dbeafe;color:#1e40af}
.fag-to{background:#d1fae5;color:#065f46}
.fag-ma{background:#ede9fe;color:#6b21a8}
.fag-kl{background:#fef3cd;color:#92510a}

/* Tom tilstand */
.empty-msg{color:var(--muted);font-size:0.9rem;padding:1rem 0;margin-bottom:2rem}
</style>
</head>

// ── Session ──
let currentUser = null;
const SESSION_KEY = 'bl_session';
function saveSession(u){ try{ localStorage.setItem(SESSION_KEY, JSON.stringify(u)); }catch(e){} }
function loadSession(){ try{ const s=localStorage.getItem(SESSION_KEY); return s?JSON.parse(s):null; }catch(e){ return null; } }
function clearSession(){ try{ localStorage.removeItem(SESSION_KEY); }catch(e){} }

async function refreshSession(){
  if(!currentUser?.refresh_token) return false;
  try{
    const res = await fetch(SUPA_URL+'/auth/v1/token?grant_type=refresh_token',{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SUPA_KEY},
      body:JSON.stringify({refresh_token:currentUser.refresh_token})
    });
    if(!res.ok) return false;
    const d = await res.json();
    currentUser = {...currentUser, access_token:d.access_token, refresh_token:d.refresh_token||currentUser.refresh_token};
    saveSession(currentUser);
    return true;
  }catch(e){ return false; }
}

// ── Login ──
async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pw    = document.getElementById('loginPw').value;
  const err   = document.getElementById('loginErr');
  const btn   = document.getElementById('loginBtn');
  err.style.display='none';
  if(!email||!pw){ err.textContent='Udfyld e-mail og adgangskode.'; err.style.display='block'; return; }
  btn.disabled=true; btn.textContent='Logger ind…';
  try{
    const res = await fetch(SUPA_URL+'/auth/v1/token?grant_type=password',{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SUPA_KEY},
      body:JSON.stringify({email,password:pw})
    });
    const d = await res.json();
    if(!res.ok) throw new Error(d.error_description||d.message||'Forkert e-mail eller adgangskode');
    currentUser = {access_token:d.access_token,refresh_token:d.refresh_token,email:d.user?.email||email,id:d.user?.id};
    saveSession(currentUser);
    showApp();
  }catch(e){
    err.textContent=e.message; err.style.display='block';
  }finally{
    btn.disabled=false; btn.textContent='Log ind';
  }
}
document.getElementById('loginPw').addEventListener('keydown', e=>{ if(e.key==='Enter') doLogin(); });
document.getElementById('loginEmail').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('loginPw').focus(); });

// ── Logout ──
async function doLogout(){
  try{
    await fetch(SUPA_URL+'/auth/v1/logout',{
      method:'POST',
      headers:{'Content-Type':'application/json','apikey':SUPA_KEY,'Authorization':'Bearer '+currentUser?.access_token}
    });
  }catch(e){}
  currentUser=null; clearSession();
  document.getElementById('app').classList.remove('visible');
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('tool-frame').src='about:blank';
  document.getElementById('tool-frame').style.display='none';
  document.getElementById('forside').classList.remove('visible');
}

// ── App vis ──
function showApp(){
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').classList.add('visible');
  document.getElementById('userBadge').textContent = currentUser.email;
  // Sidebar starter altid lukket — åbner ved mouseover
  document.getElementById('sidebar').classList.add('collapsed');
  buildMenu();
  showForside();
}

// ── Sidebar toggle ──
let sidebarOpen = false;
function toggleSidebar(){
  sidebarOpen = !sidebarOpen;
  document.getElementById('sidebar').classList.toggle('collapsed', !sidebarOpen);
}
function openSidebar(){
  sidebarOpen = true;
  document.getElementById('sidebar').classList.remove('collapsed');
}
function closeSidebar(){
  sidebarOpen = false;
  document.getElementById('sidebar').classList.add('collapsed');
}

// ── Menu ──
let activeItem = null;
function buildMenu(){
  const nav = document.getElementById('sidebar');
  nav.innerHTML = '';
  MENU.forEach(cat => {
    const wrap = document.createElement('div');
    wrap.className = 'nav-category';
    const btn = document.createElement('button');
    btn.className = 'nav-cat-btn' + (cat.open?' open':'');
    btn.innerHTML = `<span>${cat.label}</span><span class="arrow">▶</span>`;
    btn.onclick = () => { cat.open=!cat.open; btn.classList.toggle('open',cat.open); list.classList.toggle('open',cat.open); };
    wrap.appendChild(btn);
    const list = document.createElement('div');
    list.className = 'nav-items' + (cat.open?' open':'');
    if(cat.items.length===0){
      const empty = document.createElement('div');
      empty.className='nav-empty'; empty.textContent='Ingen værktøjer endnu';
      list.appendChild(empty);
    } else {
      cat.items.forEach(item => {
        const a = document.createElement('div');
        a.className = 'nav-item'+(activeItem===item.id?' active':'');
        a.dataset.id = item.id;
        a.innerHTML = `<span class="icon">${item.icon||'🔧'}</span><span class="label">${item.label}</span>${item.badge?`<span class="badge">${item.badge}</span>`:''}`;
        if(item.url){ a.onclick = () => openTool(item); }
        else { a.style.opacity='0.5'; a.style.cursor='default'; }
        list.appendChild(a);
      });
    }
    wrap.appendChild(list);
    nav.appendChild(wrap);
  });
}

function openTool(item){
  if(!item.url) return;
  try{ sessionStorage.setItem('bl_parent_session', JSON.stringify(currentUser)); }catch(e){}
  activeItem = item.id;
  buildMenu();
  document.getElementById('forside').classList.remove('visible');
  const frame = document.getElementById('tool-frame');
  frame.style.display='block';
  frame.src = item.url;
}

// ── FORSIDE DASHBOARD ──

  activeItem = null;
  buildMenu();
  document.getElementById('tool-frame').style.display='none';

  document.getElementById('forside').classList.add('visible');

  document.getElementById('forsideTitle').textContent = greeting+', '+name+' 👋';

  const dage = ['søndag','mandag','tirsdag','onsdag','torsdag','fredag','lørdag'];
  const mdr  = ['januar','februar','marts','april','maj','juni','juli','august','september','oktober','november','december'];
  const now  = new Date();
  document.getElementById('forsideSub').textContent =
    dage[now.getDay()]+' '+now.getDate()+'. '+mdr[now.getMonth()]+' '+now.getFullYear()+' · Her er dit overblik for i dag';

  loadDashboard();
}

async function supaFetch(path){
  const r = await fetch(SUPA_URL+path,{
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+currentUser.access_token}
  });
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}

async function loadDashboard(){
  try{
    // Hent alle sager (tasks er JSON-streng i kolonnen tasks)
    const sager = await supaFetch('/rest/v1/sager?select=ordrenummer,ordreoverskrift,adresse,by,postnr,ordrestatus,fag,tasks,ansvarlig_medarbejder&limit=1000');

    // Find navn på indlogget bruger til filtrering på ansvarlig_medarbejder
    const userEmail = (currentUser.email||'').toLowerCase();
    const userNavn  = EMAIL_NAVN[userEmail] || '';

    // Sagsoversigt — kun sager hvor den indloggede er ansvarlig
    const mineSager = userNavn
      ? sager.filter(s=>(s.ansvarlig_medarbejder||'')=== userNavn)
      : sager; // fallback: vis alle hvis navn ikke kendes

    const alle         = mineSager.length;
    const nyCount      = mineSager.filter(s=>(s.ordrestatus||'').toLowerCase()==='ny').length;
    const igangCount   = mineSager.filter(s=>{
      const st=(s.ordrestatus||'').toLowerCase();
      return st==='igang'||st==='igangværende'||st.startsWith('igang');
    }).length;
    const faerdigCount = mineSager.filter(s=>{
      const st=(s.ordrestatus||'').toLowerCase();
      return st.startsWith('færdig')||st==='afsluttet'||st==='færdigmeldt';
    }).length;
    document.getElementById('ss-alle').textContent    = alle;
    document.getElementById('ss-ny').textContent      = nyCount;
    document.getElementById('ss-igang').textContent   = igangCount;
    document.getElementById('ss-faerdig').textContent = faerdigCount;

    // Gennemgå tasks på alle sager (tasks er JSON-streng)
    const today = new Date(); today.setHours(0,0,0,0);
    const dag3  = new Date(today); dag3.setDate(dag3.getDate()+3);

    let forfaldne = [];
    let snart     = [];
    let totalMine = 0;

    sager.forEach(sag => {
      // Spring arkiverede sager over — samme som sagstyringen gør
      if((sag.ordrestatus||'').toLowerCase()==='arkiveret') return;
      let tasks = [];
      try{ tasks = JSON.parse(sag.tasks||'[]'); }catch(e){ tasks=[]; }
      if(!Array.isArray(tasks)) tasks=[];
      tasks.forEach(t => {
        if(t.done) return;
        if((t.user||'').toLowerCase()!==userEmail) return;
        if(!t.deadline) return;
        totalMine++;
        const dl = new Date(t.deadline); dl.setHours(0,0,0,0);
        const adresseFull = [sag.adresse, sag.postnr, sag.by].filter(Boolean).join(', ');
        const item = {
          sagsnr: sag.ordrenummer||'–',
          overskrift: sag.ordreoverskrift||sag.ordrenummer||'–',
          adresse: adresseFull,
          fag: sag.fag||'',
          task: t.text||'',
          deadline: dl,
          deadlineStr: dl.toLocaleDateString('da-DK',{day:'numeric',month:'short'})
        };
        if(dl<today)       forfaldne.push(item);
        else if(dl<=dag3)  snart.push(item);
      });
    });

    // Sorter ældste forfaldne først, snart efter deadline
    forfaldne.sort((a,b)=>a.deadline-b.deadline);
    snart.sort((a,b)=>a.deadline-b.deadline);

    // Opdater tæller-bokse
    document.getElementById('os-forfaldne').textContent = forfaldne.length;
    document.getElementById('os-snart').textContent     = snart.length;
    document.getElementById('os-total').textContent     = totalMine;

    // Render forfaldne (alle)
    renderKort('cards-forfaldne', forfaldne, 'overdue', 'Forfald');

    // Render snart (maks 4, vis "Se alle X" hvis flere)
    const MAX_SNART = 4;
    renderKort('cards-snart', snart.slice(0,MAX_SNART), 'soon', 'Forfalder');
    const btnSeAlle = document.getElementById('btn-se-alle-snart');
    const hintSnart = document.getElementById('hint-snart');
    if(snart.length>MAX_SNART){
      btnSeAlle.textContent = 'Se alle '+snart.length+' →';
      btnSeAlle.style.display='inline';
      hintSnart.textContent = 'Viser de '+MAX_SNART+' nærmeste — klik "Se alle" for at se resten i sagstyringen.';
      hintSnart.style.display='block';
    } else {
      btnSeAlle.style.display='none';
      hintSnart.style.display='none';
    }

  }catch(e){
    console.error('Dashboard fejl:', e);
  }
}

function renderKort(containerId, items, cls, prefix){
  const el = document.getElementById(containerId);
  if(!items.length){
    el.innerHTML = '<p class="empty-msg">Ingen '+(cls==='overdue'?'forfaldne':'snart forfaldne')+' opgaver 🎉</p>';
    return;
  }
  // Gruppér per sag (sagsnr)
  const grupper = [];
  const sagMap  = {};
  items.forEach(item => {
    if(!sagMap[item.sagsnr]){
      const g = {sagsnr:item.sagsnr, overskrift:item.overskrift, adresse:item.adresse, fag:item.fag, tasks:[]};
      sagMap[item.sagsnr] = g;
      grupper.push(g);
    }
    sagMap[item.sagsnr].tasks.push({text:item.task, deadlineStr:item.deadlineStr, fag:item.fag});
  });
  el.innerHTML = grupper.map(g=>`
    <div class="kunde-card ${cls}" onclick="aabSag('${g.sagsnr}')">
      <div class="card-sag">
        <span class="card-sagnr">${g.sagsnr}</span>
        <span style="flex-shrink:0">·</span>
        <span class="card-overskrift">${escHtml(g.overskrift)}</span>
      </div>
      ${g.adresse?`<div class="card-adresse">📍 ${escHtml(g.adresse)}</div>`:''}
      <div class="card-tasks">
        ${g.tasks.map(t=>`
          <div class="task-row">
            <span class="task-text">${escHtml(t.text)}</span>
            <div class="task-meta">
              <span class="deadline-pill">${prefix} ${t.deadlineStr}</span>
              ${t.fag?`<span class="card-fag ${fagClass(t.fag)}">${fagLabel(t.fag)}</span>`:''}
            </div>
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function aabSag(sagsnr){
  // Åbn sagstyring og forsøg at navigere til den specifikke sag
  try{ sessionStorage.setItem('bl_parent_session', JSON.stringify(currentUser)); }catch(e){}
  try{ sessionStorage.setItem('bl_open_sag', sagsnr); }catch(e){}
  activeItem = 'sagstyring';
  buildMenu();
  document.getElementById('forside').classList.remove('visible');
  const frame = document.getElementById('tool-frame');
  frame.style.display='block';
  frame.src = 'sagstyring.html';
}

function escHtml(s){
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Init ──
(async function init(){
  document.getElementById('spinner').classList.add('on');
  const saved = loadSession();
  if(saved?.access_token){
    currentUser = saved;
    try{
      const r = await fetch(SUPA_URL+'/auth/v1/user',{
        headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+saved.access_token}
      });
      if(r.ok){
        const u = await r.json();
        currentUser.email = u.email||saved.email;
        showApp();
      } else {
        const refreshed = await refreshSession();
        if(refreshed){ showApp(); }
        else { clearSession(); }
      }
    }catch(e){ clearSession(); }
  }
  document.getElementById('spinner').classList.remove('on');
})();
</script>
